<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Planilla RUTA 700 – Embebida</title>

  <!-- Viewport móvil moderno (incluye unidades dinámicas para iOS/Android) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <!-- Colores del tema (opcional) -->
  <meta name="theme-color" content="#0f172a">

  <style>
    /* Reset y layout de pantalla completa */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #0b1220; /* fondo del borde */
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100svh; /* móviles modernos */
      min-height: 100dvh; /* fallback moderno */
      min-height: 100vh;  /* fallback general */
      color: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    /* Barra superior */
    .appbar {
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      gap: 8px;
      /* “safe area” para iPhone con notch */
      padding-left: calc(env(safe-area-inset-left, 0px) + 12px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 12px);
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      z-index: 5;
    }
    .appbar h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .2px;
    }
    .actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 1px solid #334155;
      background: #111827;
      color: #e5e7eb;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .btn:hover { background:#0b1220; }
    .btn.secondary {
      background: transparent;
      border-color: #475569;
      color: #cbd5e1;
    }

    /* Contenedor principal que aloja el iframe */
    .main {
      position: relative;
      flex: 1;
      min-height: 0; /* importante para que el iframe pueda usar 100% */
      background: #0b1220;
      overflow: hidden;
    }
    .frame-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff; /* fondo de la app */
      /* Permite scroll suave dentro del iframe en móviles */
      -webkit-overflow-scrolling: touch;
      overflow: auto;
    }

    /* Loader superpuesto mientras carga el iframe */
    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(100% 100% at 0% 0%, rgba(4, 6, 17, 0.75) 0%, rgba(4,6,17,0.9) 70%),
        #040611;
      color: #e5e7eb;
      z-index: 2;
      transition: opacity .25s ease;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 4px solid #1f2937;
      border-top-color: #3b82f6;
      animation: spin .8s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loadcard {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1f2937;
      padding: 12px 14px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .loadtext { font-size: 14px; color: #cbd5e1; }

    /* Mensaje de error / ayuda */
    .help {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
      opacity: .9;
    }
    .help a { color: #93c5fd; text-decoration: underline; }

    /* Ajustes pequeños para pantallas muy estrechas */
    @media (max-width: 380px) {
      .appbar h1 { font-size: 14px; }
      .btn { padding: 6px 8px; font-size: 11px; }
      .loadtext { font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- AppBar -->
  <header class="appbar">
    <h1>📋 Planilla RUTA 700</h1>
    <div class="actions">
      <button class="btn" id="btnReload" title="Recargar">Recargar</button>
      
    </div>
  </header>

  <!-- Contenido principal con iframe y loader -->
  <main class="main">
    <div class="frame-wrap">
      <iframe
        id="appFrame"
        title="Planilla RUTA 700"
        src="https://script.google.com/macros/s/AKfycbx3oSXd0e0hjMo41MTXNF6zunjJX_z7_vfbw3eQqrDVev8xlgjgFqtVWCx8WzHRtccqGw/exec"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-read; clipboard-write"
        sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      ></iframe>

      <div id="loader" class="loader">
        <div class="loadcard">
          <div class="spinner"></div>
          <div class="loadtext">Cargando la aplicación…</div>
        </div>
        <div class="help">
          Si tarda demasiado, <a id="openLink2" href="#" target="_blank" rel="noopener">ábrela en una pestaña nueva</a>.
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const APP_URL = "https://script.google.com/macros/s/AKfycbx3oSXd0e0hjMo41MTXNF6zunjJX_z7_vfbw3eQqrDVev8xlgjgFqtVWCx8WzHRtccqGw/exec";
      const iframe = document.getElementById('appFrame');
      const loader = document.getElementById('loader');
      const btnReload = document.getElementById('btnReload');
      const btnOpen = document.getElementById('btnOpen');
      const openLink2 = document.getElementById('openLink2');

      btnOpen.href = APP_URL;
      openLink2.href = APP_URL;

      // Oculta loader cuando el iframe dispara 'load'
      iframe.addEventListener('load', () => {
        loader.classList.add('hidden');
      });

      // Botón recargar
      btnReload.addEventListener('click', () => {
        loader.classList.remove('hidden');
        // Forzar recarga del iframe sin tocar el scroll de la página contenedora
        iframe.src = APP_URL + (APP_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
      });

      // Timeout de seguridad: si no carga en X seg, muestra link de apertura
      setTimeout(() => {
        // Si por CSP / red tarda demasiado, dejamos visible el loader con el link de ayuda
        // (no hacemos nada más, solo aseguramos que el link está)
        openLink2.href = APP_URL;
      }, 6000);

      // Ajuste fino para cambios de orientación (algunos navegadores recalculan las unidades *vh*)
      const fit = () => {
        // No necesitamos medir contenido interno (cross-origin),
        // el layout flex + 100% alto ya cubre toda la pantalla de forma segura.
        // Este hook queda por si quisieras agregar lógica adicional en el futuro.
      };
      window.addEventListener('orientationchange', fit);
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
